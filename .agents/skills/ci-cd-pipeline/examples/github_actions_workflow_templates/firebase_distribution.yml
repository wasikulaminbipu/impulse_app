name: Firebase App Distribution (QA Internal)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes for QA Testers'
        required: false
        default: 'QA Build from CI'
      group:
        description: 'Tester Group Name'
        required: true
        default: 'internal-qa'

jobs:
  build-and-distribute:
    name: Build APK & Distribute to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Run Codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Distribute to Firebase App Distribution
        uses: FirebaseExtended/action-fastlane@v1.3.1
        with:
          args: 'android firebase_qa'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
