name: 🐛 Bug Report
description: Report a bug, crash, UI flaw, or unexpected behavior in Impulse DEX.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please provide as much context as possible.

  - type: input
    id: app_version
    attributes:
      label: App Version & Build
      description: What version of the app are you running? (e.g. v1.0.0+1)
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os_device
    attributes:
      label: Device Operating System
      options:
        - Android 15 (Target SDK 35)
        - Android 14 (API 34)
        - Android 13 (API 33)
        - Android 12 or below
        - Other
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Open the Products screen
        2. Filter by Category 'Vaccines'
        3. Tap on Product X
        4. Observe unexpected error banner
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs_screenshots
    attributes:
      label: Crash Logs or Screenshots
      description: Paste any Flutter stack trace, error logs, or attach screenshots.
