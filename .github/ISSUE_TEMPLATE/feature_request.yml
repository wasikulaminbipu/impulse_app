name: 💡 Feature Request
description: Propose a new feature, enhancement, or UI idea for Impulse DEX.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Impulse DEX! Share your idea or feature request below.

  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Summary
      description: What feature or enhancement would you like to see?
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or user workflow?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Mockups
      description: How should this feature work from a user experience standpoint?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Have you considered any alternative solutions or workarounds?
