name: PR Quality Gate & Verification

on:
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Generation (build_runner)
        run: |
          set -e
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify Generated Files Integrity (No Uncommitted Codegen Changes)
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of sync with code changes! Please run 'dart run build_runner build --delete-conflicting-outputs' locally and commit the updated generated files."
            git status --porcelain
            exit 1
          fi
          echo "All generated files are 100% up-to-date with source code."

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test --coverage


  build-verification:
    name: Clean Release Build Accuracy Check
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Clean Flutter Build Environment
        run: flutter clean

      - name: Re-Fetch Flutter Dependencies
        run: flutter pub get

      - name: Verify Release AAB Build Compilation
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols


