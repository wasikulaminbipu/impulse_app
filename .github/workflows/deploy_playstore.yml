          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | `${{ github.ref_name }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Attached Binaries** | AAB, Universal APK, Split APKs (arm64, armeabi-v7a, x86_64) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | 🚀 Published to GitHub Releases |" >> $GITHUB_STEP_SUMMARY
