name: Build & Deploy to Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - beta
          - production
      create_github_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generator Check (Drift & Freezed)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code || (echo "::error::Generated code is out of sync! Please run build_runner locally and commit changes." && exit 1)

      - name: Run Strict Static Analysis (Fatal Warnings)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

  build-and-deploy:
    name: Build AAB & Deploy via Fastlane
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: 'android'
          bundler-cache: false

      - name: Install Gem Dependencies
        run: |
          cd android
          bundle install

      - name: Verify Environment & Flutter Setup
        run: |
          set -e
          flutter doctor -v




      - name: Validate & Decode Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.PLAYSTORE_KEY_PROPERTIES }}
          PLAYSTORE_JSON_KEY: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          fi
          if [ -n "$PLAYSTORE_JSON_KEY" ]; then
            echo "$PLAYSTORE_JSON_KEY" > android/pc-api-key.json
            echo "Play Store service account JSON configured."
          else
            echo "::warning::PLAYSTORE_SERVICE_ACCOUNT_JSON secret is missing. Play Store upload step will be skipped."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Code Generator (Drift & Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Clean Flutter & Gradle Build Cache
        run: |
          flutter clean
          cd android
          ./gradlew clean
          cd ..
          flutter pub get

      - name: Build Android App Bundle (AAB) with Debug Symbols
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build Universal APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build Per-ABI Split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/symbols/
          retention-days: 30

      - name: Deploy to Play Store via Fastlane
        env:
          TRACK: ${{ github.event.inputs.track || 'internal' }}
        run: |
          if [ ! -s android/pc-api-key.json ]; then
            echo "Skipping Play Store deployment because android/pc-api-key.json is missing or empty."
          else
            cd android
            bundle exec fastlane $TRACK
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && (github.event.inputs.create_github_release == 'true' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Secrets
        if: always()
        run: |
          rm -f android/app/key.jks
          rm -f android/key.properties
          rm -f android/pc-api-key.json

